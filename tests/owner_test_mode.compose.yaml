# Disposable owner-toggle acceptance only; use project catan-owner-acceptance-test.
services:
  postgres:
    environment:
      POSTGRES_DB: catan_owner_ui_test
      POSTGRES_USER: catan
      POSTGRES_PASSWORD: public-owner-disposable-password
    ports:
      - "127.0.0.1:55442:5432"
  backend:
    networks:
      proxy:
        ipv4_address: 172.30.254.3
    environment:
      FORWARDED_ALLOW_IPS: 172.30.254.2
      CATAN_ENABLE_TEST_TOOLS: "0"
      CATAN_FOG_BETA_ADMISSION: "0"
      CATAN_FOG_BETA_EMERGENCY_STOP: "0"
      CATAN_AUTH_MODE: development
      CATAN_AUTH_ORIGINS: http://127.0.0.1:18095
      DATABASE_URL: ""
      POSTGRES_DB: catan_owner_ui_test
      POSTGRES_USER: catan
      POSTGRES_PASSWORD: public-owner-disposable-password
  web:
    networks:
      proxy:
        ipv4_address: 172.30.254.2
    ports: !override
      - "127.0.0.1:18095:8080"
networks:
  proxy:
    ipam:
      config: !override
        - subnet: 172.30.254.0/29
