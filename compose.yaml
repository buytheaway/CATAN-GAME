services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-catan}"
      POSTGRES_USER: "${POSTGRES_USER:-catan}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-catan-local-only}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 10
    stop_grace_period: 20s

  backend:
    environment:
      # Trust only the Nginx peer reserved below, never the entire Docker subnet.
      FORWARDED_ALLOW_IPS: "${CATAN_PROXY_IP:-172.30.250.2}"
      CATAN_ENABLE_TEST_TOOLS: "${CATAN_ENABLE_TEST_TOOLS:-0}"
      CATAN_ROOM_CREATE_LIMIT: "${CATAN_ROOM_CREATE_LIMIT:-20}"
      CATAN_ROOM_CREATE_WINDOW_SECONDS: "${CATAN_ROOM_CREATE_WINDOW_SECONDS:-600}"
      CATAN_ROOM_CREATE_LOBBIES_PER_IP: "${CATAN_ROOM_CREATE_LOBBIES_PER_IP:-20}"
      CATAN_ROOM_CREATE_LOBBIES_GLOBAL: "${CATAN_ROOM_CREATE_LOBBIES_GLOBAL:-1000}"
      CATAN_ROOM_CREATE_TRACKING_CAPACITY: "${CATAN_ROOM_CREATE_TRACKING_CAPACITY:-4096}"
      CATAN_PERSISTENCE_MODE: durable
      CATAN_AUTH_MODE: "${CATAN_AUTH_MODE:-production}"
      CATAN_AUTH_ORIGINS: "${CATAN_AUTH_ORIGINS:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      CATAN_DATABASE_HOST: postgres
      POSTGRES_DB: "${POSTGRES_DB:-catan}"
      POSTGRES_USER: "${POSTGRES_USER:-catan}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-catan-local-only}"
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 20s
    networks:
      default: {}
      proxy:
        ipv4_address: "${CATAN_BACKEND_PROXY_IP:-172.30.250.3}"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CATAN_WEB_PORT:-80}:8080"
    stop_grace_period: 20s
    networks:
      proxy:
        ipv4_address: "${CATAN_PROXY_IP:-172.30.250.2}"

volumes:
  postgres_data:

networks:
  default: {}
  proxy:
    ipam:
      config:
        - subnet: "${CATAN_PROXY_SUBNET:-172.30.250.0/29}"
